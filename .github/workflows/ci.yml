name: mobile-android-rl-ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_adb_integration:
        description: "Run ADB integration tests when an emulator/device is available"
        required: false
        default: "false"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: make test
      - run: make prime
      - run: make android-world

  adb-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_adb_integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: RUN_ADB_INTEGRATION=1 make integration
