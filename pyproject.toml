[project]
name = "prime-android-adk-rl-env"
version = "0.1.0"
description = "Mobile Android APK/ADK RL environment with AndroidWorld, ADB, reward, and benchmark artifacts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.18.0",
    "verifiers>=0.1.11",
]

[project.scripts]
android-adk-task = "android_adk_rl_env.runner:main"
android-adk-train = "android_adk_rl_env.train:main"
android-adk-openai-finetune = "android_adk_rl_env.openai_finetune:main"
android-adk-rl-train = "android_adk_rl_env.rl_train:main"
android-adk-rl-benchmark = "android_adk_rl_env.rl_benchmark:main"
android-adk-android-world = "android_adk_rl_env.android_world_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["android_adk_rl_env", "prime_android_adk_rl_env"]

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 1
max_concurrent = 1
