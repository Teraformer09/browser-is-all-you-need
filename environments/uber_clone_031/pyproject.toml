[project]
name = "uber-clone-031"
version = "0.7.0"
description = "One simulated Android ride task with 14 policies, 70 evidence-bound verifiers, and per-action screenshots."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["verifiers==0.3.1", "datasets==5.0.1", "PyYAML==6.0.3", "jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uber_clone_031"]

[tool.hatch.build.targets.sdist]
include = ["uber_clone_031", "scripts", "tests", "README.md", "IMPLEMENTATION_LOG.md", "POLICY_RUBRICS.md", "pyproject.toml", "Dockerfile", "app/dummy_android_app/AndroidManifest.xml", "app/dummy_android_app/src", "app/dummy_android_app/res", "app/dummy_android_app/build.gradle", "app/dummy_android_app/settings.gradle", "app/dummy_android_app/app/build.gradle"]

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 1
max_concurrent = 1
