[project]
name = "mobile-android-rl"
version = "0.1.0"
description = "Prime/verifiers-compatible mobile Android RL environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.18.0",
    "verifiers>=0.1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mobile_android_rl"]
