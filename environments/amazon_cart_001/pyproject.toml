[project]
name = "amazon-cart-001"
version = "0.2.0"
description = "Offline DemoCart Android task with 14 policies, 70 evidence-bound verifiers, model runner and per-action screenshots."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["verifiers==0.3.1", "datasets==5.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amazon_cart_001"]

[tool.hatch.build.targets.sdist]
include = ["amazon_cart_001", "scripts", "tests", "README.md", "IMPLEMENTATION_LOG.md", "pyproject.toml", "app/shopping_android_app/AndroidManifest.xml", "app/shopping_android_app/src", "app/shopping_android_app/res", "app/shopping_android_app/build.gradle", "app/shopping_android_app/settings.gradle", "app/shopping_android_app/gradle.properties", "app/shopping_android_app/gradle", "app/shopping_android_app/gradlew", "app/shopping_android_app/gradlew.bat", "app/shopping_android_app/app/build.gradle", "app/shopping_android_app/app/src"]

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 1
max_concurrent = 1
